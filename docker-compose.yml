# Khởi động:      docker compose up -d
# Kèm pgAdmin:    docker compose --profile tools up -d   (mở http://localhost:5050)
# Reset sạch DB:  docker compose down -v && docker compose up -d
# Biến môi trường đọc từ file .env (copy từ .env.example)

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: zalo_clone_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ZaloCloneDb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Chua dat POSTGRES_PASSWORD trong file .env}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: zalo_clone_pgadmin
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@zalo.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres-db:
        condition: service_healthy

volumes:
  pgdata:

